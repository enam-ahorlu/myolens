name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debt-register:
    # Runs first and on its own. If the register and the source disagree about what debt exists,
    # the rest of the pipeline's results are about a codebase we cannot describe accurately.
    name: Technical-debt register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Register and source must agree
        run: python scripts/check_satd.py --list

  palette:
    # The four task colours carry meaning -- a clinician reads the timeline by colour before
    # reading a label -- so their separability is a correctness property, not a style
    # preference, and it is gated like one. The check caught a real defect on its first run:
    # the original violet and blue collapsed to a delta-E of 0.4 under deuteranopia.
    name: Palette accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Contrast and colour-vision separation
        run: python scripts/verify_palette.py --table

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Format check
        run: ruff format --check app tests

      - name: Tests
        # Determinism is pinned in the environment as well as in code: a threaded reduction
        # order is enough to move a probability in the seventh decimal, which is enough to flip
        # an argmax on an ambiguous window, which is enough to make the equivalence test flaky
        # for reasons that have nothing to do with the export.
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
        run: pytest --cov=app --cov-report=term-missing

      - name: The serving image must build
        # Added after the first deploy failed on a malformed pip flag in the Dockerfile. Every
        # test passed; the image simply never built, and the failure surfaced in Cloud Build
        # where the pipeline could not see it. Nothing in a Python test suite executes the
        # Dockerfile, so the Dockerfile has to be executed on purpose. Roughly two minutes,
        # and it moves an entire class of failure from deploy time to test time -- where it is
        # also caught on pull requests, which never reach the deploy job at all.
        run: docker build -t myolens-api:ci .

  frontend:
    name: Front-end tests
    runs-on: ubuntu-latest
    # No job-level working-directory. `defaults.run.working-directory` is applied to the *first*
    # run step, and git does not track empty directories -- so before the front end exists there
    # is no frontend/ on the runner and the guard itself fails with "no such directory". The
    # guard has to run from the repository root to be able to report that the directory is
    # missing. Caught on the first CI run of the project.
    steps:
      - uses: actions/checkout@v5

      - name: Does the front end exist yet?
        id: guard
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/package.json yet - skipping the front-end job."
          fi

      - uses: actions/setup-node@v5
        if: steps.guard.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: steps.guard.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - if: steps.guard.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint

      - if: steps.guard.outputs.present == 'true'
        working-directory: frontend
        run: npm run test -- --run

      - if: steps.guard.outputs.present == 'true'
        working-directory: frontend
        run: npm run build

  deploy:
    # Deployment is gated on every check above it. A pipeline that can ship a revision whose
    # tests have not passed is not a pipeline, it is an upload button.
    name: Deploy to Cloud Run
    needs: [debt-register, palette, backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy the analysis service
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: myolens-api
          source: backend
          region: ${{ secrets.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          # Sizing is deliberate, not default.
          #   2 GiB   - a ten-minute nine-channel CSV parsed by pandas transiently needs several
          #             times the file size; the 512 MiB default OOMs on a real session.
          #   900 s   - the non-functional budget is 30 s for a session, but Cloud Build cold
          #             starts and the first ONNX session build are not in that budget.
          #   1 vCPU, threads pinned to 1 - determinism. D4 requires byte-identical output for
          #             identical input, and a threaded reduction order breaks that.
          #   max 3   - a ceiling on cost, not a scaling target.
          #   min 0   - scale to zero. Raised to 1 at submission so the examiner never meets a
          #             cold start; left at 0 until then because min-instances=1 bills whether
          #             anyone visits or not.
          flags: >-
            --memory=2Gi
            --cpu=1
            --timeout=900
            --max-instances=3
            --min-instances=0
            --allow-unauthenticated
          env_vars: |-
            MYOLENS_ENVIRONMENT=production
            MYOLENS_GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            MYOLENS_GCP_REGION=${{ secrets.GCP_REGION }}
            MYOLENS_PREDICTOR=ensemble
            OMP_NUM_THREADS=1
            MKL_NUM_THREADS=1

      - name: Why did the build fail?
        # A failed `deploy-cloudrun` reports only "Build failed; check build logs for details",
        # and the build log lives in Cloud Build, not in this run. Without this step the next
        # person debugging a broken image is reading a sentence that tells them nothing. Runs
        # only on failure, so it costs nothing when things work.
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          BUILD=$(gcloud builds list \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ secrets.GCP_REGION }}" \
            --limit=1 --format='value(id)')
          echo "Cloud Build $BUILD - last 150 lines:"
          gcloud builds log "$BUILD" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ secrets.GCP_REGION }}" | tail -150

      - name: Prove the revision actually serves
        # A green deploy step means Cloud Run accepted the revision, not that the service works.
        # This asks the running container to state the contract it is serving, and fails if the
        # montage or the class order came back wrong -- which would mean a stale image.
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Deployed to $URL"
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 30 "$URL/v1/health" -o health.json; then break; fi
            echo "attempt $attempt failed, retrying"; sleep 10
          done
          cat health.json
          python - <<'CHECK'
          import json, sys
          h = json.load(open("health.json"))
          problems = []
          if h.get("status") != "ok":
              problems.append(f"status is {h.get('status')!r}")
          if h.get("classes") != ["DNS", "STDUP", "UPS", "WAK"]:
              problems.append(f"class order is {h.get('classes')!r}")
          if h.get("montage_channels") != 9:
              problems.append(f"montage has {h.get('montage_channels')} channels")
          if h.get("sampling_rate_hz") != 1920.0:
              problems.append(f"sampling rate is {h.get('sampling_rate_hz')}")
          if problems:
              print("FAIL  the deployed revision is not serving the expected contract:")
              for p in problems:
                  print("  -", p)
              sys.exit(1)
          print("OK  deployed revision serves the frozen contract")
          CHECK

      - name: Record the URL
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.deploy.outputs.url }}\`" >> "$GITHUB_STEP_SUMMARY"
